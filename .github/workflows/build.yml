name: Build & Release Bypass Browser (Cross-Platform)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile Windows Executable
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name "BypassBrowser" --add-data "startpage;startpage" browser.py
          xcopy /E /I /Y "startpage" "dist\BypassBrowser\startpage"
          xcopy /E /I /Y "extensions" "dist\BypassBrowser\extensions"
          powershell -Command "Compress-Archive -Path 'dist\BypassBrowser\*' -DestinationPath 'dist\BypassBrowser-Windows-x64.zip' -Force"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BypassBrowser-Windows-x64
          path: dist/BypassBrowser-Windows-x64.zip

  build-macos:
    name: Build macOS Universal
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pywebview[cocoa]>=5.0"
          pip install pyinstaller

      - name: Compile macOS Application
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name "BypassBrowser" --add-data "startpage:startpage" browser.py
          cd dist
          zip -r "BypassBrowser-macOS-Universal.zip" BypassBrowser.app || zip -r "BypassBrowser-macOS-Universal.zip" BypassBrowser

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BypassBrowser-macOS-Universal
          path: dist/BypassBrowser-macOS-Universal.zip

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux WebKit Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgirepository1.0-dev gir1.2-webkit2-4.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pywebview[gtk]>=5.0"
          pip install pyinstaller

      - name: Compile Linux Binary
        run: |
          python -m PyInstaller --noconfirm --onedir --name "BypassBrowser" --add-data "startpage:startpage" browser.py
          cd dist
          tar -czvf "BypassBrowser-Linux-x86_64.tar.gz" BypassBrowser

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BypassBrowser-Linux-x86_64
          path: dist/BypassBrowser-Linux-x86_64.tar.gz

  release:
    name: Publish Multi-Platform Release Assets
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: BypassBrowser-Windows-x64
          path: release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: BypassBrowser-macOS-Universal
          path: release-assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: BypassBrowser-Linux-x86_64
          path: release-assets

      - name: Publish All Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/BypassBrowser-Windows-x64.zip
            release-assets/BypassBrowser-macOS-Universal.zip
            release-assets/BypassBrowser-Linux-x86_64.tar.gz
          generate_release_notes: true
